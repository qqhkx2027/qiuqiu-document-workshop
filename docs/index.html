<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>秋秋证件工坊 · qiuqiu-document-workshop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="eyebrow">LOCAL IN BROWSER · PRIVATE</div>
        <h1>秋秋证件工坊</h1>
        <p>上传或直接拍摄身份证正反面，自动透视矫正并生成一张 A4 PDF。</p>
      </header>

      <section class="notice">
        <strong>隐私说明</strong>
        <span>照片和 PDF 全程在浏览器本地处理，不上传到服务器。</span>
      </section>

      <div class="alert" id="status" role="status">正在加载本地处理引擎……</div>

      <section class="card">
        <div class="steps">
          <span class="step active">1</span><span>上传两面照片</span>
          <i></i>
          <span class="step">2</span><span>自动矫正</span>
          <i></i>
          <span class="step">3</span><span>下载 PDF</span>
        </div>

        <div class="upload-grid">
          <label class="upload-box" for="front">
            <span class="upload-label">身份证正面</span>
            <span class="upload-hint">国徽面 · 建议平行拍摄</span>
            <img class="preview" id="frontPreview" alt="正面预览" hidden />
            <span class="upload-action" id="frontAction">选择照片 / 打开相机</span>
            <input id="front" type="file" accept="image/*" capture="environment" />
          </label>
          <label class="upload-box" for="back">
            <span class="upload-label">身份证反面</span>
            <span class="upload-hint">信息面 · 避免反光和遮挡</span>
            <img class="preview" id="backPreview" alt="反面预览" hidden />
            <span class="upload-action" id="backAction">选择照片 / 打开相机</span>
            <input id="back" type="file" accept="image/*" capture="environment" />
          </label>
        </div>

        <div class="tip-list">
          <span>拍摄建议</span>
          <ul>
            <li>让证件四条边完整出现在画面中，避免反光和手指遮挡。</li>
            <li>背景尽量干净，证件边缘与背景有明显对比。</li>
            <li>输出为 A4 纵向 PDF，正面和反面各占标准身份证大小。</li>
          </ul>
        </div>

        <button class="submit" id="submit" type="button" disabled>自动裁剪并生成 PDF</button>
      </section>
    </main>
    <script>
      window.opencvReady = new Promise((resolve) => {
        window.Module = { onRuntimeInitialized: () => resolve(window.cv) };
      });
    </script>
    <script src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
